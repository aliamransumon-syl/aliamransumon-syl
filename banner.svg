<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Ali Amran Sumon — Sylhet, Bangladesh">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#061F18"/>
      <stop offset="45%"  stop-color="#0B3D2E"/>
      <stop offset="100%" stop-color="#14543F"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"   stop-color="#FFD9A0" stop-opacity="0.95"/>
      <stop offset="55%"  stop-color="#F2A65A" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#F2A65A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="river" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0E7490" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0B3D2E" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="terrace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#2FBF71" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#1A7A4C" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#061F18" stop-opacity="0.92"/>
      <stop offset="45%"  stop-color="#061F18" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#061F18" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1200" height="320" rx="12"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="url(#sky)"/>
    <circle cx="905" cy="128" r="150" fill="url(#sun)"/>
    <circle cx="905" cy="128" r="31" fill="#FFCE8A" opacity="0.92"/>

    <!-- far Khasi hills -->
    <path d="M0 150 L95 112 L178 142 L268 100 L365 138 L452 108 L548 146 L640 116 L742 150 L838 122 L935 152 L1040 118 L1130 148 L1200 126 L1200 320 L0 320 Z"
          fill="#0C4A39" opacity="0.55"/>
    <!-- mid hills -->
    <path d="M0 184 L112 152 L212 180 L318 146 L430 182 L540 154 L648 188 L760 158 L872 190 L985 160 L1098 192 L1200 166 L1200 320 L0 320 Z"
          fill="#0B3D2E" opacity="0.85"/>

    <!-- tea terraces -->
    <g stroke="url(#terrace)" fill="none" stroke-linecap="round">
      <path d="M-20 212 Q 300 192 620 214 T 1220 206" stroke-width="3" opacity="0.75"/>
      <path d="M-20 226 Q 300 204 620 228 T 1220 218" stroke-width="3" opacity="0.68"/>
      <path d="M-20 241 Q 300 217 620 243 T 1220 231" stroke-width="4" opacity="0.62"/>
      <path d="M-20 257 Q 300 231 620 259 T 1220 245" stroke-width="4" opacity="0.55"/>
      <path d="M-20 274 Q 300 246 620 276 T 1220 260" stroke-width="5" opacity="0.48"/>
      <path d="M-20 292 Q 300 262 620 294 T 1220 276" stroke-width="5" opacity="0.4"/>
      <path d="M-20 311 Q 300 279 620 313 T 1220 293" stroke-width="6" opacity="0.32"/>
    </g>

    <!-- tea bushes -->
    <g fill="#2FBF71" opacity="0.4">
      <circle cx="148" cy="243" r="5"/><circle cx="236" cy="262" r="6"/><circle cx="332" cy="236" r="4"/>
      <circle cx="455" cy="272" r="6"/><circle cx="560" cy="248" r="5"/><circle cx="690" cy="280" r="6"/>
      <circle cx="795" cy="252" r="5"/><circle cx="910" cy="286" r="6"/><circle cx="1035" cy="258" r="5"/>
    </g>

    <!-- Surma river -->
    <path d="M0 196 Q 220 186 430 199 T 860 194 T 1200 201 L1200 224 Q 860 216 430 222 T 0 218 Z"
          fill="url(#river)" opacity="0.6"/>

    <!-- Keane Bridge silhouette -->
    <g stroke="#061F18" fill="none" opacity="0.8" stroke-linecap="round">
      <path d="M624 200 L624 176 M700 200 L700 176 M776 200 L776 176" stroke-width="3"/>
      <path d="M612 178 Q 700 128 788 178" stroke-width="4"/>
      <path d="M612 178 Q 700 150 788 178" stroke-width="2.5" opacity="0.65"/>
      <path d="M606 200 L794 200" stroke-width="4"/>
      <path d="M640 200 L640 162 M664 200 L664 150 M688 200 L688 143 M712 200 L712 143 M736 200 L736 150 M760 200 L760 162"
            stroke-width="1.6" opacity="0.6"/>
    </g>

    <!-- mist -->
    <path d="M0 206 Q 300 196 600 208 T 1200 202 L1200 232 L0 232 Z" fill="#DFF5EA" opacity="0.07"/>
    <path d="M0 230 Q 340 220 680 232 T 1200 226 L1200 252 L0 252 Z" fill="#DFF5EA" opacity="0.05"/>

    <!-- birds -->
    <g stroke="#DFF5EA" fill="none" stroke-width="1.8" opacity="0.5" stroke-linecap="round">
      <path d="M1000 72 q 7 -6 14 0 q 7 -6 14 0"/>
      <path d="M1052 96 q 5.5 -5 11 0 q 5.5 -5 11 0"/>
      <path d="M964 108 q 4.5 -4 9 0 q 4.5 -4 9 0"/>
    </g>

    <!-- left fade for text legibility -->
    <rect width="760" height="320" fill="url(#fade)"/>

    <!-- type -->
    <text x="72" y="140" font-family="'Trebuchet MS', 'Segoe UI', Verdana, sans-serif"
          font-size="54" font-weight="700" fill="#FFFFFF" letter-spacing="0.5">Ali Amran Sumon</text>
    <text x="74" y="178" font-family="'Trebuchet MS', 'Segoe UI', Verdana, sans-serif"
          font-size="20" font-weight="600" fill="#2FBF71" letter-spacing="3.4">FULL-STACK DEVELOPER</text>
    <text x="74" y="210" font-family="'Trebuchet MS', 'Segoe UI', Verdana, sans-serif"
          font-size="17" fill="#A7D9C2" letter-spacing="1.1">Sylhet &#183; Bangladesh</text>
    <rect x="74" y="226" width="58" height="3" rx="1.5" fill="#2FBF71"/>
  </g>
</svg>
